name: uth-library
services:
  app:
    image: ${LIBRARY_IMAGE:-uth-library:local}
    build: .
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATA_DIR: /var/lib/library
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Set SITE_DOMAIN in backend/.env}
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "172.30.47.2", "--no-access-log"]
    volumes:
      - runtime:/var/lib/library
    networks:
      proxy:
        ipv4_address: 172.30.47.3
      model:
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in backend/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: 172.30.47.2
    depends_on:
      app:
        condition: service_healthy
    logging:
      options: {max-size: "10m", max-file: "3"}
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks:
      - model
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging:
      options: {max-size: "10m", max-file: "3"}
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.20.0}
    profiles: ["qdrant"]
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - model
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '^HTTP/1\\.[01] 200 '"]
      interval: 15s
      timeout: 5s
      retries: 4
    security_opt:
      - no-new-privileges:true
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  runtime:
  ollama:
  qdrant_data:
  caddy_data:
  caddy_config:
networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.47.0/29
  model:
